<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="p-5">
    <div class="container">
        <form id="userForm" th:action="@{/save}" th:object="${user}" method="POST">
            <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 w-25"> 
            <input type="text" th:field="*{username}" placeholder="Username" class="form-control mb-4 w-25"> 
            <input type="text" th:field="*{password}" placeholder="Password" class="form-control mb-4 w-25"> 
            <input type="text" th:field="*{email}" placeholder="Email" class="form-control mb-4 w-25"> 
            <div>
                <p>Authority:</p>
                <select id="authoritySelect">
                    <option th:value="ADMIN" th:text="ADMIN"></option>
                    <option th:value="ASSIGNOR" th:text="ASSIGNOR"></option>
                    <option th:value="ASSIGNEE" th:text="ASSIGNEE"></option>
                </select>
            </div>
            <input type="hidden" name="authority" id="authorityInput">
            <button class="btn btn-info col-2" type="button" onclick="submitForm()">Save</button>
        </form>
    </div>
    <script>
        function submitForm() {
            document.getElementById('authorityInput').value = document.getElementById('authoritySelect').value;
            document.getElementById('userForm').submit();
        }
        </script>
</body>
</html>
