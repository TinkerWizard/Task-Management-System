<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add User</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="p-5">
    <div class="container">
      <span th:text="${lastNumbers}" id="lastNumbers" hidden></span>
      <span
        th:text="${lastNumbers.lastAdminUserNumber}"
        id="lastAdminUserNumber"
        hidden
      ></span>
      <span
        th:text="${lastNumbers.lastAssignorUserNumber}"
        id="lastAssignorUserNumber"
        hidden
      ></span>
      <span
        th:text="${lastNumbers.lastAssigneeUserNumber}"
        id="lastAssigneeUserNumber"
        hidden
      ></span>
      <form
        id="userForm"
        th:action="@{/save}"
        th:object="${user}"
        method="POST"
      >
        <input
          type="text"
          th:field="*{name}"
          placeholder="Name"
          class="form-control mb-4 w-25"
        />
        <div class="mb-3">
          <label for="authoritySelect" class="form-label">User Type:</label>
          <select
            id="authoritySelect"
            class="form-control mb-4 w-25"
            onchange="generateUsername()"
          >
            <option value="" disabled selected>Select User Type</option>
            <option value="ADMIN">ADMIN</option>
            <option value="ASSIGNOR">ASSIGNOR</option>
            <option value="ASSIGNEE">ASSIGNEE</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="generatedUsername" class="form-label"
            >Generated Username:</label
          >
          <input
            type="text"
            id="generatedUsername"
            name="generatedUsername"
            class="form-control mb-4 w-25"
            readonly
          />
        </div>
        <input
          type="text"
          th:field="*{password}"
          placeholder="Password"
          class="form-control mb-4 w-25"
        />
        <input
          type="text"
          th:field="*{email}"
          placeholder="Email"
          class="form-control mb-4 w-25"
        />
        <!-- <div>
                <p>Authority:</p>
                <select id="authoritySelect">
                    <option th:value="ADMIN" th:text="ADMIN"></option>
                    <option th:value="ASSIGNOR" th:text="ASSIGNOR"></option>
                    <option th:value="ASSIGNEE" th:text="ASSIGNEE"></option>
                </select>
            </div> -->
        <input type="hidden" name="authority" id="authorityInput" />
        <!-- <input type="hidden" name="username" id="username"> -->
        <button class="btn btn-info col-2" type="button" onclick="submitForm()">
          Save
        </button>
      </form>
    </div>
    <script>
      function submitForm() {
        document.getElementById("authorityInput").value =
          document.getElementById("authoritySelect").value;
        // document.getElementById("username").value =
        //   document.getElementById("generatedUsername").value;
        document.getElementById("userForm").submit();
      }

      function generateUsername() {
        const lastAdminUserNumber = parseInt(
          document.getElementById("lastAdminUserNumber").textContent
        );
        const lastAssignorUserNumber = parseInt(
          document.getElementById("lastAssignorUserNumber").textContent
        );
        const lastAssigneeUserNumber = parseInt(
          document.getElementById("lastAssigneeUserNumber").textContent
        );
        const selectElement = document.getElementById("authoritySelect");
        const selectedValue = selectElement.value;

        let usernamePrefix = "";
        let newNumber;

        if (selectedValue === "ADMIN") {
          newNumber = lastAdminUserNumber + 1;
          usernamePrefix = "ADMIN";
        } else if (selectedValue === "ASSIGNOR") {
          newNumber = lastAssignorUserNumber + 1;
          usernamePrefix = "NOR";
        } else if (selectedValue === "ASSIGNEE") {
          newNumber = lastAssigneeUserNumber + 1;
          usernamePrefix = "NEE";
        }

        const username = usernamePrefix + "_" + newNumber;
        document.getElementById("generatedUsername").value = username;
        console.log(username);
      }
    </script>
  </body>
</html>
