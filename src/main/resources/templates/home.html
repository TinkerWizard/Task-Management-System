<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Home</h1>
    <div sec:authorize="hasAuthority('ADMIN')">
      <!-- <span th:text="${user.username}" /> -->
      <!-- Only admins can view this div content -->
      <p>
        <a th:href="@{/admin}">Admin</a>
        (Only for Admin Peeps)
      </p>
      <hr />
    </div>
    <div sec:authorize="hasAuthority('ASSIGNOR')">
      <!-- Only admins can view this div content -->
       <div th:object="${user}">
         <span th:text="*{name}"/>
         <span th:text="*{username}" />
         <span th:text="*{email}" />
       </div>
      <p>
        <a th:href="@{/assignor(username=${user.username})}" th:object="${user.username}">Assignor</a>
        (Only for Assignor Peeps)
      </p>
      <hr />
    </div>
    <div sec:authorize="hasAuthority('ASSIGNEE')">
      <!-- Only admins can view this div content -->
      <p>
        <a th:href="@{/assignee(username=${user.username})}">Assignee</a>
        (Only for Assignee Peeps)
      </p>
      <hr />
    </div>
    <form th:action="@{/logout}" method="POST">
      <input type="submit" value="Logout" />
    </form>
  </body>
</html>
