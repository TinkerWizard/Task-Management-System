<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="p-5">
    <div class="container">
        <h1>Login Form</h1>
        <form th:action="@{/authenticateTheUser}" method="POST" th:object="${loginForm}">
            <div th:if="${param.error}">
                <p class="btn btn-danger">ERROR</p>
            </div>
            <input th:field="*{username}" type="text" id="username" class="form-control mb-2 w-25" placeholder="Username" name="username" required autofocus/>
            <input th:field="*{password}" type="password" id="password" class="form-control mb-2 w-25" placeholder="Password" name="password" required/>
            <button type="submit" class="btn btn-info col-2">Submit</button>
        </form>
    </div>
</body>
</html>
