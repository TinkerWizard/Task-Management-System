<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add User</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="p-5">
    <div class="container">
      <h1>Update User</h1>
      <form
        id="userForm"
        th:action="@{/saveUpdate}"
        th:object="${user}"
        method="POST"
      >
        <input
          type="text"
          th:field="*{name}"
          placeholder="Name"
          class="form-control mb-4 w-25"
        />
        <input
          type="text"
          th:field="*{username}"
          class="form-control mb-4 w-25"
          readonly
        />

        <input
          type="text"
          th:field="*{password}"
          placeholder="Password"
          class="form-control mb-4 w-25"
        />
        <input
          type="text"
          th:field="*{email}"
          placeholder="Email"
          class="form-control mb-4 w-25"
        />
        <input type="hidden" name="adminUsername" th:value="${adminUsername}" />
        <input class="btn btn-info col-2" type="submit" value="Save" th:object="${user.username}" />
      </form>
    </div>
  </body>
</html>
