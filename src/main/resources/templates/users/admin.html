<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="p-5">
    <div class="container">
        <h3>Admin Dashboard</h3>
        <div class="container mb-5">
            <form th:action="@{/admin/add}" method="GET">
                <input type="hidden" name="adminUsername" th:value="${adminUsername}" />
                <button type="submit" class="btn btn-link p-0">Add User</button>
            </form>
        </div>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user: ${users}">
                    <td th:text="${user.name}" />
                    <td th:text="${user.username}" />
                    <td th:text="${user.password}" />
                    <td th:text="${user.email}" />
                    <td>
                        <form th:action="@{/admin/update}" method="get">
                            <input type="hidden" name="username" th:value="${user.username}" />
                            <input type="hidden" name="adminUsername" th:value="${adminUsername}" />
                            <button type="submit" class="btn btn-link p-0">Update</button>
                        </form>
                        <form th:action="@{/admin/delete}" method="get">
                            <input type="hidden" name="username" th:value="${user.username}" />
                            <input type="hidden" name="adminUsername" th:value="${adminUsername}" />
                            <button type="submit" class="btn btn-link p-0">Delete</button>
                        </form>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
